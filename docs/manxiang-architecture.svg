<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">慢想技术架构图</title>
  <desc id="desc">展示慢想 MVP 从用户输入、ManxiangPipeline 编排、领域策略模块、领域模型、本地 JSON 存储到受控外部搜索与未来 LLM 能力的关系。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#526070"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #1F2933; }
      .title { font-size: 31px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #64748B; }
      .group { fill: #FAFAF8; stroke: #D7D2C9; stroke-width: 1.5; rx: 16; }
      .group-title { font-size: 18px; font-weight: 700; }
      .box-title { font-size: 15px; font-weight: 700; }
      .box-text { font-size: 12.8px; fill: #4B5563; }
      .tiny { font-size: 11.8px; fill: #6B7280; }
      .entry { fill: #F7F5EF; stroke: #B9A46A; stroke-width: 1.4; rx: 10; }
      .pipe { fill: #E9F2FF; stroke: #5B8CC0; stroke-width: 1.5; rx: 10; }
      .domain { fill: #FFF0E7; stroke: #D98D5F; stroke-width: 1.4; rx: 10; }
      .model { fill: #EAF7EF; stroke: #78B58B; stroke-width: 1.4; rx: 10; }
      .store { fill: #F1EEF8; stroke: #9A83C4; stroke-width: 1.4; rx: 10; }
      .ext { fill: #EEF6F8; stroke: #5FA4B8; stroke-width: 1.4; rx: 10; }
      .output { fill: #F8F8F1; stroke: #A8AA67; stroke-width: 1.4; rx: 10; }
      .line { stroke: #526070; stroke-width: 1.55; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 6 6; }
      .thin { stroke-width: 1.2; }
      .badge { font-size: 11px; font-weight: 700; fill: #FFFFFF; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="1120" fill="#FFFFFF"/>
  <text x="48" y="54" class="title">慢想技术架构图</text>
  <text x="48" y="82" class="subtitle">当前实现更像“领域工作流 Agent”：用状态机、策略模块和受控工具边界约束研究过程，而不是一个无边界通用聊天/编码 Agent。</text>

  <!-- Groups -->
  <rect x="40" y="125" width="260" height="710" class="group"/>
  <text x="62" y="158" class="group-title">用户与入口</text>

  <rect x="345" y="125" width="250" height="710" class="group"/>
  <text x="367" y="158" class="group-title">编排层</text>

  <rect x="640" y="125" width="435" height="710" class="group"/>
  <text x="662" y="158" class="group-title">领域角色 / 策略模块</text>

  <rect x="1120" y="125" width="420" height="220" class="group"/>
  <text x="1142" y="158" class="group-title">领域模型</text>

  <rect x="1120" y="385" width="420" height="270" class="group"/>
  <text x="1142" y="418" class="group-title">本地持久化</text>

  <rect x="1120" y="695" width="420" height="250" class="group"/>
  <text x="1142" y="728" class="group-title">外部能力边界</text>

  <rect x="40" y="875" width="1035" height="170" class="group"/>
  <text x="62" y="908" class="group-title">默认产出</text>

  <!-- User / entry -->
  <rect x="70" y="190" width="200" height="96" class="entry"/>
  <text x="90" y="218" class="box-title">用户输入</text>
  <text x="90" y="242" class="box-text">链接 / 文本</text>
  <text x="90" y="262" class="box-text">截图说明 / 视频笔记</text>
  <text x="90" y="282" class="box-text">实时感想</text>

  <rect x="70" y="355" width="200" height="76" class="entry"/>
  <text x="90" y="383" class="box-title">manxiang/examples/07_manxiang_mvp.py</text>
  <text x="90" y="407" class="box-text">当前 CLI demo 入口</text>

  <rect x="70" y="505" width="200" height="92" class="entry"/>
  <text x="90" y="533" class="box-title">未来产品入口</text>
  <text x="90" y="557" class="box-text">Browser Extension</text>
  <text x="90" y="577" class="box-text">App / API / Web UI</text>

  <!-- Pipeline -->
  <rect x="385" y="330" width="170" height="118" class="pipe"/>
  <text x="410" y="362" class="box-title">ManxiangPipeline</text>
  <text x="410" y="388" class="box-text">MVP 工作流门面</text>
  <text x="410" y="408" class="box-text">串起收藏、主题发现</text>
  <text x="410" y="428" class="box-text">立项、主线和地图</text>

  <!-- Domain -->
  <rect x="680" y="170" width="170" height="82" class="domain"/>
  <text x="700" y="198" class="box-title">CaptureProcessor</text>
  <text x="700" y="222" class="box-text">轻量收藏处理器</text>
  <text x="700" y="242" class="box-text">归档 / 标签 / 候选主题</text>

  <rect x="870" y="170" width="170" height="82" class="domain"/>
  <text x="890" y="198" class="box-title">TopicDiscoverer</text>
  <text x="890" y="222" class="box-text">主题发现器</text>
  <text x="890" y="242" class="box-text">聚类 / 成熟度评分</text>

  <rect x="680" y="330" width="170" height="98" class="domain"/>
  <text x="700" y="358" class="box-title">TaskNavigator</text>
  <text x="700" y="382" class="box-text">任务导航器</text>
  <text x="700" y="402" class="box-text">研究契约 / 主线推荐</text>
  <text x="700" y="422" class="box-text">范围与风险提示</text>

  <rect x="870" y="330" width="170" height="98" class="domain"/>
  <text x="890" y="358" class="box-title">KnowledgeMapBuilder</text>
  <text x="890" y="382" class="box-text">知识地图生成器</text>
  <text x="890" y="402" class="box-text">文本视图 + 只读树</text>
  <text x="890" y="422" class="box-text">证据缺口 / 停车场</text>

  <rect x="680" y="510" width="170" height="92" class="domain"/>
  <text x="700" y="538" class="box-title">InterventionPolicy</text>
  <text x="700" y="562" class="box-text">干预策略</text>
  <text x="700" y="582" class="box-text">提醒 / 限制 / 拒绝</text>

  <rect x="870" y="510" width="170" height="92" class="domain"/>
  <text x="890" y="538" class="box-title">EvidencePatcher</text>
  <text x="890" y="562" class="box-text">证据补丁器</text>
  <text x="890" y="582" class="box-text">只在补证据阶段搜索</text>

  <rect x="770" y="675" width="180" height="78" class="domain"/>
  <text x="790" y="704" class="box-title">未来写作编辑器</text>
  <text x="790" y="728" class="box-text">报告 / 短札记升级</text>
  <text x="790" y="748" class="tiny">当前文档设计，代码未实现</text>

  <!-- Model -->
  <rect x="1155" y="190" width="350" height="108" class="model"/>
  <text x="1178" y="220" class="box-title">manxiang/src/manxiang/schema.py</text>
  <text x="1178" y="245" class="box-text">dataclasses + Literal 状态机</text>
  <text x="1178" y="265" class="box-text">CaptureItem / TopicCluster / ResearchTask</text>
  <text x="1178" y="285" class="box-text">LinePlan / KnowledgeMap / EvidenceItem / InterventionDecision</text>

  <!-- Store -->
  <rect x="1155" y="450" width="150" height="78" class="store"/>
  <text x="1180" y="480" class="box-title">JsonStore</text>
  <text x="1180" y="504" class="box-text">本地 JSON MVP</text>

  <rect x="1330" y="430" width="80" height="42" class="store"/>
  <text x="1343" y="456" class="tiny">captures</text>
  <rect x="1425" y="430" width="80" height="42" class="store"/>
  <text x="1447" y="456" class="tiny">topics</text>
  <rect x="1330" y="490" width="80" height="42" class="store"/>
  <text x="1354" y="516" class="tiny">tasks</text>
  <rect x="1425" y="490" width="80" height="42" class="store"/>
  <text x="1451" y="516" class="tiny">maps</text>
  <rect x="1330" y="550" width="80" height="42" class="store"/>
  <text x="1348" y="576" class="tiny">evidence</text>
  <rect x="1425" y="550" width="80" height="42" class="store"/>
  <text x="1445" y="576" class="tiny">parking</text>

  <!-- External -->
  <rect x="1155" y="770" width="150" height="70" class="ext"/>
  <text x="1175" y="798" class="box-title">SearchProvider</text>
  <text x="1175" y="820" class="box-text">Protocol 边界</text>

  <rect x="1330" y="735" width="175" height="70" class="ext"/>
  <text x="1350" y="763" class="box-title">FakeSearchProvider</text>
  <text x="1350" y="785" class="box-text">测试 / 本地 demo</text>

  <rect x="1330" y="830" width="175" height="70" class="ext"/>
  <text x="1350" y="858" class="box-title">未来真实联网搜索</text>
  <text x="1350" y="880" class="box-text">只服务证据缺口</text>

  <rect x="1155" y="870" width="150" height="58" class="ext"/>
  <text x="1175" y="895" class="box-title">未来 LLM</text>
  <text x="1175" y="915" class="box-text">增强摘要/聚类/写作</text>

  <!-- Outputs -->
  <rect x="70" y="940" width="170" height="70" class="output"/>
  <text x="90" y="968" class="box-title">主题清单</text>
  <text x="90" y="990" class="box-text">fragment / gathering / ready</text>

  <rect x="275" y="940" width="170" height="70" class="output"/>
  <text x="295" y="968" class="box-title">研究任务契约</text>
  <text x="295" y="990" class="box-text">目标 / 范围 / 模式</text>

  <rect x="480" y="940" width="170" height="70" class="output"/>
  <text x="500" y="968" class="box-title">主线方案</text>
  <text x="500" y="990" class="box-text">因果 / 时间 / 问题等</text>

  <rect x="685" y="940" width="170" height="70" class="output"/>
  <text x="705" y="968" class="box-title">知识地图</text>
  <text x="705" y="990" class="box-text">文本 + 树 + 缺口</text>

  <rect x="890" y="940" width="150" height="70" class="output"/>
  <text x="910" y="968" class="box-title">证据补丁</text>
  <text x="910" y="990" class="box-text">来源绑定节点</text>

